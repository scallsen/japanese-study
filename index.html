<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Japanese Study</title>
    <meta name="theme-color" content="#1E1E1E" />
    <!-- The UI is English (see CLAUDE.md) with Japanese only in content data,
         so a page-wide lang="ja" made Chrome's translate heuristic see a
         Japanese page full of English text and translate it inconsistently,
         corrupting the Japanese it's meant to teach. notranslate opts the
         whole page out; individual Japanese runs are marked lang="ja" via
         the Japanese component so they stay untouched even if a viewer
         forces translation anyway. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>*, *::before, *::after { box-sizing: border-box; } html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1E1E1E; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
